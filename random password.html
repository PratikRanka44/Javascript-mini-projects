<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="css/random password.css">
</head>
<body background="images/layout.png">
 <div class="container">
    <h1>Generate a <br><span>Random Password</span></h1>
    <div class="display">
        <input type="text" id="password" placeholder="Password">
        <img src="images/copy.png" onclick="CopyPassword()">
    </div>
    <button onclick=" CreatePassword()"><img src="images/generate.png">Generate Password</button>
 </div> 

<script>
const passwordBox = document.getElementById("password");
const length = 12;
const upperCase = "QWERTYUIOPLKJHGFDSAZXCVBNM";
const lowerCase = "qwertyuioplkjhgfdsazxcvbnm";
const number = "023456789";
const symbol = "!@#$%^&*()_-+=?/{}[]";

const allChars = upperCase + lowerCase + number + symbol;

function CreatePassword() {
let password = "";
 password += upperCase[Math.floor(Math.random() * upperCase.length)];
 password += upperCase[Math.floor(Math.random() * lowerCase.length)];
 password += upperCase[Math.floor(Math.random() * number.length)];
 password += upperCase[Math.floor(Math.random() * symbol.length)];

 while(length > password.length){
    password += allChars[Math.floor(Math.random() * allChars.length)];
 }
 passwordBox.value = password;
}

function CopyPassword(){
    passwordBox.select();
    document.execCommand("Copy");
}

</script>

</body>
</html>
